server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: edtech-api
  datasource:

    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/edtech_db}
    username: ${SPRING_DATASOURCE_USERNAME:edtech_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
  flyway:
    baseline-on-migrate: true
  mail:
    host: ${SMTP_HOST:sandbox.smtp.mailtrap.io}
    port: ${SMTP_PORT:2525}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET:}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cookie-secure: ${JWT_COOKIE_SECURE:false}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

storage:
  provider: ${STORAGE_PROVIDER:s3}

gcp:
  project-id: ${GCP_PROJECT_ID:}
  credentials-location: ${GCP_CREDENTIALS_LOCATION:}
  bucket: ${GCP_BUCKET_NAME:}

s3:
  access-key: ${AWS_ACCESS_KEY_ID:}
  secret-key: ${AWS_SECRET_ACCESS_KEY:}
  endpoint: ${S3_ENDPOINT:https://abc.supabase.co/storage/v1/s3}
  region: ${S3_REGION:us-east-1}
  bucket: ${S3_BUCKET_NAME:documents}
