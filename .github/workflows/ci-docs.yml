name: Deploy MkDocs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - '.github/workflows/ci-docs.yml'
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Cache do MkDocs
        uses: actions/cache@v6
        with:
          path: .cache
          key: mkdocs-cache-${{ hashFiles('mkdocs.yml') }}
          restore-keys: |
            mkdocs-cache-

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Gerar Relatório JaCoCo
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw clean test jacoco:report

      - name: Gerar Relatório PiTest
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw org.pitest:pitest-maven:mutationCoverage -B -Dpitest.threads=4

      - name: Integrar JaCoCo na Documentação
        run: |
          mkdir -p docs/jacoco
          if [ -d "backend/target/site/jacoco" ]; then
            cp -r backend/target/site/jacoco/* docs/jacoco/ || true
          else
            echo "Nenhum relatório JaCoCo encontrado (talvez não existam testes). Pulando."
          fi

      - name: Integrar PiTest na Documentação
        run: |
          mkdir -p docs/pitest
          if [ -d "backend/target/pit-reports" ]; then
            cp -r backend/target/pit-reports/* docs/pitest/ || true
          else
            echo "Nenhum relatório PiTest encontrado. Pulando."
          fi

      - name: Setup Node.js (E2E)
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Instalar Dependências e Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Executar Testes Unitários (Vitest)
        working-directory: frontend
        run: npm run test || true

      - name: Integrar Vitest na Documentação
        run: |
          mkdir -p docs/vitest
          if [ -d "frontend/html" ]; then
            cp -r frontend/html/* docs/vitest/ || true
          fi

      - name: Executar Smoke Tests (Allure)
        working-directory: frontend
        run: npx playwright test || true
        env:
          BASE_URL: 'https://edtech-storage-501117.web.app'

      - name: Install K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Executar Testes de Carga (K6)
        working-directory: tests/performance
        run: k6 run load-test.js || true

      - name: Integrar K6 na Documentação
        run: |
          mkdir -p docs/k6
          if [ -f "tests/performance/k6-summary.html" ]; then
            cp tests/performance/k6-summary.html docs/k6/index.html || true
          fi

      - name: Restaurar Histórico do Allure (Trend)
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-branch

      - name: Preparar Dados do Allure (Trend, Categories, Executors)
        if: always()
        working-directory: frontend
        run: |
          mkdir -p allure-results/history
          cp -R ../gh-pages-branch/allure/history/* allure-results/history/ || true
          cp allure-categories.json allure-results/categories.json || true
          echo '{"name": "GitHub Actions", "type": "github", "reportName": "EdTech Smoke Tests", "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "buildOrder": "${{ github.run_number }}", "buildName": "${{ github.workflow }}", "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' > allure-results/executor.json
          echo "Browser=Chromium" > allure-results/environment.properties
          echo "Environment=Production Smoke" >> allure-results/environment.properties
          echo "OS=Ubuntu Latest" >> allure-results/environment.properties

      - name: Gerar Allure Report
        if: always()
        working-directory: frontend
        run: |
          npx allure-commandline generate allure-results -o ../docs/allure --clean

      - name: Instalar dependências
        run: uv sync

      - name: Verificar links quebrados (Strict Build)
        env:
          NO_MKDOCS_2_WARNING: "true"
          PYTHONWARNINGS: "ignore::DeprecationWarning"
        run: uv run mkdocs build

      - name: Deploy para GitHub Pages
        env:
          NO_MKDOCS_2_WARNING: "true"
          PYTHONWARNINGS: "ignore::DeprecationWarning"
        run: uv run mkdocs gh-deploy --force
