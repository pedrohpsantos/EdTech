name: Deploy MkDocs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - '.github/workflows/ci-docs.yml'
      - 'docvault/api/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Cache do MkDocs
        uses: actions/cache@v6
        with:
          path: .cache
          key: mkdocs-cache-${{ hashFiles('mkdocs.yml') }}
          restore-keys: |
            mkdocs-cache-

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Gerar Relatório JaCoCo
        working-directory: docvault/api
        run: |
          chmod +x mvnw
          ./mvnw clean test jacoco:report

      - name: Integrar JaCoCo na Documentação
        run: |
          mkdir -p docs/jacoco
          if [ -d "docvault/api/target/site/jacoco" ]; then
            cp -r docvault/api/target/site/jacoco/* docs/jacoco/ || true
          else
            echo "Nenhum relatório JaCoCo encontrado (talvez não existam testes). Pulando."
          fi

      - name: Instalar dependências
        run: uv sync

      - name: Verificar links quebrados (Strict Build)
        run: uv run mkdocs build --strict

      - name: Deploy para GitHub Pages
        run: uv run mkdocs gh-deploy --force