name: Deploy MkDocs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - '.github/workflows/ci-docs.yml'
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-reports:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # backend-jacoco = JUnit + JaCoCo coverage report
        # backend-pitest = Mutation testing report (PiTest)
        # frontend       = Vitest + Allure smoke test report
        # performance    = K6 load test report
        # lighthouse     = Auditoria UX/SEO/Performance
        report-type: [backend-jacoco, backend-pitest, frontend, performance, lighthouse]
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v7

      # ==========================
      # BACKEND — JaCoCo
      # ==========================
      - name: Configurar JDK 21 (JaCoCo)
        if: matrix.report-type == 'backend-jacoco'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: 'backend/pom.xml'

      - name: Gerar Relatorio JaCoCo
        if: matrix.report-type == 'backend-jacoco'
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw clean test jacoco:report -B -T 1C \
            -Dsurefire.parallel=classes \
            -Dsurefire.threadCount=4 \
            -Dsurefire.perCoreThreadCount=false

      - name: Preparar Artefatos JaCoCo
        if: matrix.report-type == 'backend-jacoco'
        run: |
          mkdir -p reports/jacoco
          if [ -d "backend/target/site/jacoco" ]; then
            cp -r backend/target/site/jacoco/* reports/jacoco/ || true
          fi

      - name: Upload JaCoCo Report
        if: matrix.report-type == 'backend-jacoco'
        uses: actions/upload-artifact@v7
        with:
          name: backend-jacoco-reports
          path: reports/

      # ==========================
      # BACKEND — PiTest
      # ==========================
      - name: Configurar JDK 21 (PiTest)
        if: matrix.report-type == 'backend-pitest'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: 'backend/pom.xml'

      - name: Cache PiTest History
        if: matrix.report-type == 'backend-pitest'
        uses: actions/cache@v5
        with:
          path: backend/target/pitHistory.txt
          key: pitest-history-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            pitest-history-${{ github.ref }}-
            pitest-history-

      - name: Gerar Relatorio PiTest
        if: matrix.report-type == 'backend-pitest'
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw clean test-compile org.pitest:pitest-maven:mutationCoverage -B -Dpitest.threads=8 -DwithHistory=true

      - name: Preparar Artefatos PiTest
        if: matrix.report-type == 'backend-pitest'
        run: |
          mkdir -p reports/pitest
          if [ -d "backend/target/pit-reports" ]; then
            cp -r backend/target/pit-reports/* reports/pitest/ || true
          fi

      - name: Upload PiTest Report
        if: matrix.report-type == 'backend-pitest'
        uses: actions/upload-artifact@v7
        with:
          name: backend-pitest-reports
          path: reports/

      # ==========================
      # FRONTEND
      # ==========================
      - name: Setup Node.js
        if: matrix.report-type == 'frontend'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Instalar Dependencias
        if: matrix.report-type == 'frontend'
        working-directory: frontend
        run: npm ci

      - name: Obter versÃ£o do Playwright
        if: matrix.report-type == 'frontend'
        id: playwright-version
        working-directory: frontend
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache dos navegadores Playwright
        if: matrix.report-type == 'frontend'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ steps.playwright-version.outputs.version }}

      - name: Instalar navegador Chromium
        if: matrix.report-type == 'frontend'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Executar Testes Unitarios (Vitest)
        if: matrix.report-type == 'frontend'
        working-directory: frontend
        run: npm run test
        env:
          # Evita resumos Vitest repetidos durante as execuções mutadas do Stryker.
          GITHUB_ACTIONS: 'false'

      - name: Cache Stryker History
        if: matrix.report-type == 'frontend'
        uses: actions/cache@v5
        with:
          path: frontend/reports/mutation/stryker-incremental.json
          key: stryker-history-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            stryker-history-${{ github.ref }}-
            stryker-history-

      - name: Executar Testes de Mutação (Stryker)
        if: matrix.report-type == 'frontend'
        working-directory: frontend
        run: npx stryker run
        env:
          # O relatório HTML do Stryker é a fonte de verdade para a documentação.
          GITHUB_ACTIONS: 'false'

      - name: Restaurar Historico do Allure (Trend)
        if: matrix.report-type == 'frontend'
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-branch

      - name: Executar Smoke Tests (Allure)
        if: matrix.report-type == 'frontend'
        working-directory: frontend
        run: npx playwright test || true
        env:
          BASE_URL: 'https://edtechacademic.com.br'

      - name: Gerar Allure Report
        if: matrix.report-type == 'frontend'
        working-directory: frontend
        run: |
          mkdir -p allure-results/history
          cp -R ../gh-pages-branch/allure/history/* allure-results/history/ || true
          cp allure-categories.json allure-results/categories.json || true
          echo '{"name": "GitHub Actions", "type": "github", "reportName": "EdTech Smoke Tests"}' > allure-results/executor.json
          printf 'Browser=Chromium\nEnvironment=Production Smoke\n' > allure-results/environment.properties
          npx allure-commandline generate allure-results -o allure-report --clean

      - name: Preparar Artefatos Frontend
        if: matrix.report-type == 'frontend'
        run: |
          mkdir -p reports/vitest reports/allure reports/stryker
          cp -r frontend/html/. reports/vitest/
          cp -r frontend/allure-report/. reports/allure/
          cp -r frontend/reports/mutation/html/. reports/stryker/
          test -f reports/vitest/index.html
          test -f reports/allure/index.html
          test -f reports/stryker/index.html

      - name: Upload Frontend Reports
        if: matrix.report-type == 'frontend'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-reports
          path: reports/
          if-no-files-found: error

      # ==========================
      # FRONTEND — Lighthouse
      # ==========================
      - name: Setup Node.js for Lighthouse
        if: matrix.report-type == 'lighthouse'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run Lighthouse Audit
        if: matrix.report-type == 'lighthouse'
        run: |
          npm install -g @lhci/cli@0.13.0
          mkdir -p tests/lighthouse
          lhci collect --config=tests/lighthouse/lighthouserc.json --url="https://edtechacademic.com.br/" --numberOfRuns=3
          lhci assert --config=tests/lighthouse/lighthouserc.json
          npm install -g http-server
          lhci upload --config=tests/lighthouse/lighthouserc.json --target=filesystem --outputDir=tests/lighthouse
          FIRST_HTML=$(find tests/lighthouse -name "*.html" | head -n 1)
          if [ -n "$FIRST_HTML" ]; then
            mv "$FIRST_HTML" tests/lighthouse/index.html
            find tests/lighthouse -name "*.html" -not -name "index.html" -delete
          fi
      - name: Upload Lighthouse Report
        if: matrix.report-type == 'lighthouse'
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: tests/lighthouse/index.html

      # ==========================
      # PERFORMANCE
      # ==========================
      - name: Install K6
        if: matrix.report-type == 'performance'
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Executar Testes de Carga (K6)
        if: matrix.report-type == 'performance'
        working-directory: tests/performance
        env:
          API_URL: 'https://edtech-backend-shv6qbpf4q-rj.a.run.app'
        run: k6 run load-test.js || true

      - name: Preparar Artefato K6
        if: matrix.report-type == 'performance'
        run: |
          mkdir -p reports/k6
          if [ -f "tests/performance/k6-summary.html" ]; then
            cp tests/performance/k6-summary.html reports/k6/index.html || true
          fi

      - name: Upload Performance Reports
        if: matrix.report-type == 'performance'
        uses: actions/upload-artifact@v7
        with:
          name: performance-reports
          path: reports/

  deploy-mkdocs:
    runs-on: ubuntu-latest
    needs: [generate-reports]
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Cache dependencias uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-

      - name: Instalar dependencias MkDocs
        run: uv sync

      - name: Download JaCoCo Reports
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: backend-jacoco-reports
          path: docs/

      - name: Download PiTest Reports
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: backend-pitest-reports
          path: docs/

      - name: Download Frontend Reports
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: frontend-reports
          path: docs/
          
      - name: Download Lighthouse Reports
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: lighthouse-reports
          path: docs/lighthouse/

      - name: Download Performance Reports
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: performance-reports
          path: docs/

      - name: Verificar links quebrados (Strict Build)
        env:
          NO_MKDOCS_2_WARNING: "true"
          PYTHONWARNINGS: "ignore::DeprecationWarning"
        run: uv run mkdocs build

      - name: Deploy para GitHub Pages
        env:
          NO_MKDOCS_2_WARNING: "true"
          PYTHONWARNINGS: "ignore::DeprecationWarning"
        run: uv run mkdocs gh-deploy --force
