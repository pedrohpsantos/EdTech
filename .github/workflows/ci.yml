name: CI / CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  # ==========================================
  #                 BACKEND
  # ==========================================
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run Lint / Code Style Check
        run: |
          chmod +x mvnw
          ./mvnw compile checkstyle:check spotbugs:check -B

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: lint-backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Compile Code
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests -T 1C -B
      - name: Upload Build Target
        uses: actions/upload-artifact@v7
        with:
          name: backend-target
          path: backend/target/
  
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: build-backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Download Build Target
        uses: actions/download-artifact@v8
        with:
          name: backend-target
          path: backend/target/
      - name: Run Tests & Coverage
        run: |
          chmod +x mvnw
          ./mvnw verify -B -T 1C
      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: "**/site/jacoco"
          if-no-files-found: warn
      - name: Run Mutation Tests (PiTest)
        run: ./mvnw org.pitest:pitest-maven:mutationCoverage -B -Dpitest.threads=4
      - name: Cache NVD Vulnerability Database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-data-${{ github.run_id }}
          restore-keys: |
            nvd-data-
      - name: Run Security Audit (OWASP)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          chmod +x mvnw
          echo "Iniciando auditoria de segurança estrita. Falhas bloquearão a pipeline."
          
          # Tentativas máximas para tolerar a instabilidade da NVD API
          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if [ -z "$NVD_API_KEY" ]; then
              echo "NVD_API_KEY ausente. Executando sem chave (Maior chance de Rate Limit)... Tentativa $(($RETRY_COUNT+1))/$MAX_RETRIES"
              if ./mvnw org.owasp:dependency-check-maven:check -B -T 1C -Ddependency-check.nvdApiDelay=16000; then
                SUCCESS=1
                break
              fi
            else
              echo "NVD_API_KEY encontrada. Executando com chave... Tentativa $(($RETRY_COUNT+1))/$MAX_RETRIES"
              if ./mvnw org.owasp:dependency-check-maven:check -B -T 1C -Ddependency-check.nvdApiKey=$NVD_API_KEY -Ddependency-check.nvdApiDelay=8000; then
                SUCCESS=1
                break
              fi
            fi
            
            RETRY_COUNT=$(($RETRY_COUNT+1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Falha na comunicação com a NVD (403/404). Aguardando 30 segundos antes de tentar novamente..."
              sleep 30
            fi
          done
          
          if [ $SUCCESS -eq 0 ]; then
            echo "Auditoria de segurança falhou após $MAX_RETRIES tentativas. Bloqueando a pipeline!"
            exit 1
          else
            echo "Auditoria de segurança concluída com sucesso."
          fi

  # ==========================================
  #                 FRONTEND
  # ==========================================
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run Type Check
        run: npm run type-check
      - name: Run Security Audit
        run: npm run security-audit

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint-frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: |
          npm run build
          echo ${{ github.sha }} > dist/version.txt
        env:
          VITE_API_URL: https://edtech-backend-shv6qbpf4q-rj.a.run.app
      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: build-frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests (Vitest)
        run: npm run test
      - name: Run Accessibility tests (WCAG)
        run: npm run test:a11y
      - name: Run Component tests
        run: npm run test:components

  # ==========================================
  #                 DEPLOY
  # ==========================================
  deploy-backend:
    name: Deploy Backend (Cloud Run)
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v7
      
      - id: 'auth'
        name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
          
      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download Build Target
        uses: actions/download-artifact@v8
        with:
          name: backend-target
          path: backend/target/

      - name: Configure Docker
        run: gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          docker build -t southamerica-east1-docker.pkg.dev/edtech-storage-501117/cloud-run-source-deploy/edtech-backend:${{ github.sha }} -f backend/Dockerfile.ci backend/
          docker push southamerica-east1-docker.pkg.dev/edtech-storage-501117/cloud-run-source-deploy/edtech-backend:${{ github.sha }}
          
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy edtech-backend \
            --image southamerica-east1-docker.pkg.dev/edtech-storage-501117/cloud-run-source-deploy/edtech-backend:${{ github.sha }} \
            --region southamerica-east1 \
            --allow-unauthenticated \
            --memory 1024Mi \
            --min-instances 0 \
            --max-instances 5 \
            --cpu-boost \
            --add-cloudsql-instances edtech-storage-501117:southamerica-east1:edtech-db-dev \
            --set-env-vars 'SPRING_PROFILES_ACTIVE=prod,STORAGE_PROVIDER=gcs,GCP_PROJECT_ID=edtech-storage-501117,GCP_BUCKET_NAME=edtech-vault-storage,SPRING_JPA_HIBERNATE_DDL_AUTO=validate,CORS_ALLOWED_ORIGINS=https://edtech-storage-501117.web.app' \
            --set-secrets 'SPRING_DATASOURCE_URL=SPRING_DATASOURCE_URL:latest,SPRING_DATASOURCE_USERNAME=SPRING_DATASOURCE_USERNAME:latest,SPRING_DATASOURCE_PASSWORD=SPRING_DATASOURCE_PASSWORD:latest,JWT_SECRET=JWT_SECRET:latest'

  deploy-frontend:
    name: Deploy Frontend (Firebase)
    runs-on: ubuntu-latest
    needs: test-frontend
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v7
      
      - id: 'auth'
        name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Deploy to Firebase Hosting
        working-directory: frontend
        run: |
          npm install -g firebase-tools
          firebase deploy --project=edtech-storage-501117 --only hosting -m "Deploy via GitHub Actions ${{ github.sha }}" --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

  e2e-production:
    name: E2E Smoke Tests (Production)
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E Production Tests
        working-directory: frontend
        run: npx playwright test
        env:
          BASE_URL: 'https://edtech-storage-501117.web.app'

  performance-production:
    name: Load Tests (K6)
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Install K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      - name: Run K6 Load Test
        working-directory: tests/performance
        run: k6 run load-test.js
      - name: Upload K6 Summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-summary
          path: tests/performance/k6-summary.json
