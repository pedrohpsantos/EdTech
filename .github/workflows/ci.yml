name: CI / CD (Unified)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  # ==========================================
  #                 BACKEND
  # ==========================================
  backend-ci:
    name: Backend CI Pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docvault/api
    env:
      _JAVA_OPTIONS: "-XX:+EnableDynamicAgentLoading -Xshare:off"
      MAVEN_OPTS: "-XX:+EnableDynamicAgentLoading -Xshare:off"
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRATION_MINUTES: 60
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          
      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw
          
      - name: Run Lint / Code Style Check
        run: ./mvnw validate -B

      - name: Compile and Test
        run: ./mvnw verify -B
        
      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: docvault/api/target/site/jacoco
          if-no-files-found: warn
          
      - name: Run Mutation Tests (PiTest)
        run: ./mvnw org.pitest:pitest-maven:mutationCoverage -B

  # ==========================================
  #                 FRONTEND
  # ==========================================
  frontend-ci:
    name: Frontend CI Pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run lint
        run: npm run lint
        
      - name: Build
        run: npm run build
        
      - name: Run unit tests
        run: npm run test
        
      - name: Run E2E Tests (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

  # ==========================================
  #                 DEPLOY
  # ==========================================
  deploy:
    name: Deploy All
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Step Placeholder
        run: echo "Executando o deploy integrado do Backend e Frontend..."
