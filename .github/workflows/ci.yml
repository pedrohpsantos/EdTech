name: CI / CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  # ==========================================
  #                 BACKEND
  # ==========================================
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run Lint / Code Style Check
        run: |
          chmod +x mvnw
          ./mvnw compile checkstyle:check spotbugs:check -B

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: lint-backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Compile Code
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests -T 1C -B
      - name: Upload Build Target
        uses: actions/upload-artifact@v7
        with:
          name: backend-target
          path: backend/target/
  
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: build-backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Download Build Target
        uses: actions/download-artifact@v8
        with:
          name: backend-target
          path: backend/target/
      - name: Run Tests & Coverage
        run: |
          chmod +x mvnw
          ./mvnw verify -B
      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: "**/site/jacoco"
          if-no-files-found: warn
      - name: Run Mutation Tests (PiTest)
        run: ./mvnw org.pitest:pitest-maven:mutationCoverage -B
      - name: Cache NVD Vulnerability Database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-data-${{ github.run_id }}
          restore-keys: |
            nvd-data-
      - name: Run Security Audit (OWASP)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          chmod +x mvnw
          echo "Iniciando auditoria de segurança estrita. Falhas bloquearão a pipeline."
          
          # Tentativas máximas para tolerar a instabilidade da NVD API
          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if [ -z "$NVD_API_KEY" ]; then
              echo "NVD_API_KEY ausente. Executando sem chave (Maior chance de Rate Limit)... Tentativa $(($RETRY_COUNT+1))/$MAX_RETRIES"
              if ./mvnw org.owasp:dependency-check-maven:check -B -Ddependency-check.nvdApiDelay=16000; then
                SUCCESS=1
                break
              fi
            else
              echo "NVD_API_KEY encontrada. Executando com chave... Tentativa $(($RETRY_COUNT+1))/$MAX_RETRIES"
              if ./mvnw org.owasp:dependency-check-maven:check -B -Ddependency-check.nvdApiKey=$NVD_API_KEY -Ddependency-check.nvdApiDelay=8000; then
                SUCCESS=1
                break
              fi
            fi
            
            RETRY_COUNT=$(($RETRY_COUNT+1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Falha na comunicação com a NVD (403/404). Aguardando 30 segundos antes de tentar novamente..."
              sleep 30
            fi
          done
          
          if [ $SUCCESS -eq 0 ]; then
            echo "Auditoria de segurança falhou após $MAX_RETRIES tentativas. Bloqueando a pipeline!"
            exit 1
          else
            echo "Auditoria de segurança concluída com sucesso."
          fi

  # ==========================================
  #                 FRONTEND
  # ==========================================
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run Type Check
        run: npm run type-check
      - name: Run Security Audit
        run: npm run security-audit

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint-frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: |
          npm run build
          echo ${{ github.sha }} > dist/version.txt
        env:
          VITE_API_URL: https://edtech-backend-shv6qbpf4q-rj.a.run.app
      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: build-frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests (Vitest)
        run: npm run test
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E Tests (Playwright)
        run: npx playwright test

  # ==========================================
  #                 DEPLOY
  # ==========================================
  trigger-cloud-build:
    name: Trigger Cloud Build (CD)
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v7
      
      - id: 'auth'
        name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
          
      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download Build Target
        uses: actions/download-artifact@v8
        with:
          name: backend-target
          path: backend/target/

      - name: Create gcloudignore
        run: |
          echo ".git" > .gcloudignore
          echo "frontend/node_modules" >> .gcloudignore
          echo ".github" >> .gcloudignore
      - name: Trigger Cloud Build CD
        run: |
          gcloud builds submit --config infra/cloudbuild.yaml \
            --substitutions=_FIREBASE_SA_SECRET=FIREBASE_SERVICE_ACCOUNT_EDTECH,COMMIT_SHA=${{ github.sha }} .
