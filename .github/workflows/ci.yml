name: CI / CD (Unified)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  # ==========================================
  #                 BACKEND
  # ==========================================
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docvault/api
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run Lint / Code Style Check
        run: |
          chmod +x mvnw
          ./mvnw validate

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: lint-backend
    defaults:
      run:
        working-directory: docvault/api
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Compile Code
        run: |
          chmod +x mvnw
          ./mvnw clean compile -T 1C
      - name: Upload Build Target
        uses: actions/upload-artifact@v4
        with:
          name: backend-target
          path: docvault/api/target/
  
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: build-backend
    defaults:
      run:
        working-directory: docvault/api
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Download Build Target
        uses: actions/download-artifact@v4
        with:
          name: backend-target
          path: docvault/api/target/
      - name: Run Tests
        run: |
          chmod +x mvnw
          ./mvnw verify
        env: 
          AWS_ACCESS_KEY_ID: dummy_key
          AWS_SECRET_ACCESS_KEY: dummy_secret
          S3_ENDPOINT: https://abc.supabase.co/storage/v1/s3
          S3_REGION: us-east-1
          S3_BUCKET_NAME: documents
          JWT_SECRET: supersecretjwtsecretkeyformyspringbootapp123
          JWT_EXPIRATION_MINUTES: 60
      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: docvault/api/target/site/jacoco
          if-no-files-found: warn
      - name: Run Mutation Tests (PiTest)
        run: ./mvnw org.pitest:pitest-maven:mutationCoverage
        env: 
          AWS_ACCESS_KEY_ID: dummy_key
          AWS_SECRET_ACCESS_KEY: dummy_secret
          S3_ENDPOINT: https://abc.supabase.co/storage/v1/s3
          S3_REGION: us-east-1
          S3_BUCKET_NAME: documents
          JWT_SECRET: supersecretjwtsecretkeyformyspringbootapp123
          JWT_EXPIRATION_MINUTES: 60

  # ==========================================
  #                 FRONTEND
  # ==========================================
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint-frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: build-frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test
      - name: Run E2E Tests (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

  # ==========================================
  #                 DEPLOY
  # ==========================================
  deploy:
    name: Deploy All
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Step Placeholder
        run: echo "Executando o deploy integrado do Backend e Frontend..."
