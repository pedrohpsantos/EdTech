name: CI / CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  # ==========================================
  #                 BACKEND
  # ==========================================
  backend-tasks:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: edtech_user
          POSTGRES_PASSWORD: edtech_password
          POSTGRES_DB: edtech_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        task: [lint, build, test, pitest, security]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # --- LINT ---
      - name: Run Lint / Code Style Check
        if: matrix.task == 'lint'
        run: |
          chmod +x mvnw
          ./mvnw compile checkstyle:check spotbugs:check -B

      # --- BUILD ---
      - name: Compile Code
        if: matrix.task == 'build'
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests -T 1C -B
      - name: Upload Build Target
        if: matrix.task == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: backend-target
          path: backend/target/

      # --- TEST ---
      - name: Run Tests & Coverage
        if: matrix.task == 'test'
        id: backend-tests
        run: |
          chmod +x mvnw
          ./mvnw clean test jacoco:report -B -T 1C
      - name: Upload JaCoCo Report
        if: always() && matrix.task == 'test'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: "**/site/jacoco"
          if-no-files-found: warn
      - name: Backend Test Summary
        if: always() && matrix.task == 'test'
        run: |
          {
            echo "## Backend test summary"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Unit tests and coverage | ${{ steps.backend-tests.outcome }} |"
            echo
            echo "### JUnit results"
          } >> "$GITHUB_STEP_SUMMARY"

          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import xml.etree.ElementTree as ET

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for path in glob.glob("target/surefire-reports/TEST-*.xml"):
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))

          if totals["tests"] == 0:
              print("No Surefire XML reports were found.")
          else:
              print("| Tests | Failures | Errors | Skipped |")
              print("| ---: | ---: | ---: | ---: |")
              print(f"| {totals['tests']} | {totals['failures']} | {totals['errors']} | {totals['skipped']} |")
          PY

      # --- PITEST ---
      - name: Run Mutation Tests (PiTest)
        if: matrix.task == 'pitest'
        run: |
          chmod +x mvnw
          ./mvnw clean test-compile org.pitest:pitest-maven:mutationCoverage -B -Dpitest.threads=4

      # --- SECURITY ---
      - name: Cache NVD Vulnerability Database
        if: matrix.task == 'security'
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-data-${{ github.run_id }}
          restore-keys: |
            nvd-data-
      - name: Run Security Audit (OWASP)
        if: matrix.task == 'security'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          chmod +x mvnw
          echo "Iniciando auditoria de segurança estrita. Falhas bloquearão a pipeline."
          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if [ -z "$NVD_API_KEY" ]; then
              if ./mvnw org.owasp:dependency-check-maven:check -B -T 1C -Ddependency-check.nvdApiDelay=16000; then SUCCESS=1; break; fi
            else
              if ./mvnw org.owasp:dependency-check-maven:check -B -T 1C -Ddependency-check.nvdApiKey=$NVD_API_KEY -Ddependency-check.nvdApiDelay=8000; then SUCCESS=1; break; fi
            fi
            RETRY_COUNT=$(($RETRY_COUNT+1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then sleep 30; fi
          done
          if [ $SUCCESS -eq 0 ]; then exit 1; fi

  # ==========================================
  #                 FRONTEND
  # ==========================================
  frontend-tasks:
    name: Frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, build, test]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install dependencies
        run: npm ci

      # --- LINT ---
      - name: Run lint
        if: matrix.task == 'lint'
        run: npm run lint
      - name: Run Type Check
        if: matrix.task == 'lint'
        run: npm run type-check
      - name: Run Security Audit
        if: matrix.task == 'lint'
        run: npm run security-audit

      # --- BUILD ---
      - name: Build
        if: matrix.task == 'build'
        run: |
          npm run build
          echo ${{ github.sha }} > dist/version.txt
        env:
          VITE_API_URL: https://edtech-backend-shv6qbpf4q-rj.a.run.app
      - name: Upload Frontend Artifact
        if: matrix.task == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/

      # --- TEST ---
      - name: Run unit tests (Vitest)
        if: matrix.task == 'test'
        id: unit-tests
        run: npm run test
      - name: Run Accessibility tests (WCAG)
        if: matrix.task == 'test'
        id: accessibility-tests
        run: npm run test:a11y
      - name: Run Component tests
        if: matrix.task == 'test'
        id: component-tests
        run: npm run test:components
      - name: Frontend Test Summary
        if: always() && matrix.task == 'test'
        run: |
          {
            echo "## Frontend test summary"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Unit tests (Vitest) | ${{ steps.unit-tests.outcome }} |"
            echo "| Accessibility tests (WCAG) | ${{ steps.accessibility-tests.outcome }} |"
            echo "| Component tests | ${{ steps.component-tests.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"


  # ==========================================
  #                 INFRASTRUCTURE
  # ==========================================
  infra-tasks:
    name: Infrastructure
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [validate, docker-build]
    steps:
      - uses: actions/checkout@v7

      # --- TERRAFORM VALIDATE ---
      - name: Setup Terraform
        if: matrix.task == 'validate'
        uses: hashicorp/setup-terraform@v4
      - name: Terraform Format Check
        if: matrix.task == 'validate'
        working-directory: infra/terraform
        run: terraform fmt -check
      - name: Terraform Init
        if: matrix.task == 'validate'
        working-directory: infra/terraform
        run: terraform init -backend=false
      - name: Terraform Validate
        if: matrix.task == 'validate'
        working-directory: infra/terraform
        run: terraform validate

      # --- DOCKER BUILD & PUSH ---
      - name: Set up JDK 21
        if: matrix.task == 'docker-build'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Compile Backend for Docker
        if: matrix.task == 'docker-build'
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests -T 1C -B
      - id: 'auth'
        if: matrix.task == 'docker-build' && github.ref == 'refs/heads/main'
        name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
      - name: Configure Docker Auth
        if: matrix.task == 'docker-build' && github.ref == 'refs/heads/main'
        run: gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet
      - name: Set up Docker Buildx
        if: matrix.task == 'docker-build' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker Image
        if: matrix.task == 'docker-build' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: backend/
          file: backend/Dockerfile.ci
          push: true
          tags: southamerica-east1-docker.pkg.dev/edtech-storage-501117/cloud-run-source-deploy/edtech-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  #                 GATEKEEPERS
  # ==========================================
  backend-approved:
    name: Backend Approved
    runs-on: ubuntu-latest
    needs: [backend-tasks]
    steps:
      - run: echo "✅ All Backend Validations Passed"

  frontend-approved:
    name: Frontend Approved
    runs-on: ubuntu-latest
    needs: [frontend-tasks]
    steps:
      - run: echo "✅ All Frontend Validations Passed"

  infra-approved:
    name: Infra Approved
    runs-on: ubuntu-latest
    needs: [infra-tasks]
    steps:
      - run: echo "✅ All Infrastructure Validations Passed"

  # ==========================================
  #                 DEPLOY
  # ==========================================
  deploy-tasks:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [backend-approved, frontend-approved, infra-approved]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: 'read'
      id-token: 'write'
    strategy:
      fail-fast: false
      matrix:
        target: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      
      - id: 'auth'
        name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      # --- BACKEND DEPLOY ---
      - name: Setup Cloud SDK
        if: matrix.target == 'backend'
        uses: google-github-actions/setup-gcloud@v3

      - name: Setup Terraform
        if: matrix.target == 'backend'
        uses: hashicorp/setup-terraform@v4
        
      - name: Terraform Init
        if: matrix.target == 'backend'
        working-directory: infra/terraform
        run: terraform init -backend-config="bucket=edtech-terraform-state-501117"

      - name: Terraform Apply
        if: matrix.target == 'backend'
        working-directory: infra/terraform
        run: |
          terraform apply -auto-approve             -var="project_id=edtech-storage-501117"             -var="backend_image_tag=${{ github.sha }}"             -var="storage_bucket_name=edtech-vault-storage"             -var="cors_allowed_origin=https://edtech-storage-501117.web.app" || {
              echo "Terraform Apply failed. Fetching Cloud Run logs for debugging:"
              gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="edtech-backend" AND severity>=ERROR' --limit 50 --format="value(textPayload)" --project=edtech-storage-501117
              exit 1
            }

      - name: Run Database Migrations (Cloud Run Job)
        if: matrix.target == 'backend'
        run: |
          echo "Executando job de migração do banco de dados (Flyway)..."
          gcloud run jobs execute edtech-backend-migration --region southamerica-east1 --wait --project edtech-storage-501117

      # --- FRONTEND DEPLOY ---
      - name: Set up Node 24
        if: matrix.target == 'frontend'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download Frontend Artifact
        if: matrix.target == 'frontend'
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Deploy to Firebase Hosting
        if: matrix.target == 'frontend'
        working-directory: frontend
        run: |
          npm install -g firebase-tools
          firebase deploy --project=edtech-storage-501117 --only hosting -m "Deploy via GitHub Actions ${{ github.sha }}" --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

  # ==========================================
  #                 PRODUCTION TESTS
  # ==========================================
  production-tests:
    name: Production Tests
    runs-on: ubuntu-latest
    needs: [deploy-tasks]
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        test: [e2e, performance]
    steps:
      - uses: actions/checkout@v7
      
      # --- E2E SMOKE TESTS ---
      - name: Set up Node 24
        if: matrix.test == 'e2e'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        if: matrix.test == 'e2e'
        working-directory: frontend
        run: npm ci
      - name: Get Playwright version
        if: matrix.test == 'e2e'
        id: playwright-version
        working-directory: frontend
        run: |
          PLAYWRIGHT_VERSION=$(npx playwright --version | awk '{print $2}')
          echo "version=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT
      - name: Cache Playwright browsers
        if: matrix.test == 'e2e'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        if: matrix.test == 'e2e'
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E Production Tests
        if: matrix.test == 'e2e'
        id: e2e-production-tests
        working-directory: frontend
        run: npx playwright test
        env:
          BASE_URL: 'https://edtech-storage-501117.web.app'
      - name: Production E2E Summary
        if: always() && matrix.test == 'e2e'
        run: |
          {
            echo "## Production E2E summary"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Playwright smoke tests | ${{ steps.e2e-production-tests.outcome }} |"
            echo
            echo "Base URL: https://edtech-storage-501117.web.app"
          } >> "$GITHUB_STEP_SUMMARY"

      # --- PERFORMANCE TESTS ---
      - name: Install K6
        if: matrix.test == 'performance'
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      - name: Run K6 Load Test
        if: matrix.test == 'performance'
        id: k6-load-test
        working-directory: tests/performance
        env:
          API_URL: 'https://edtech-backend-shv6qbpf4q-rj.a.run.app'
        run: k6 run load-test.js
      - name: Production Load Test Summary
        if: always() && matrix.test == 'performance'
        run: |
          {
            echo "## Production load test summary"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| K6 load test | ${{ steps.k6-load-test.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f tests/performance/k6-summary.json ]; then
            {
              echo
              echo "K6 JSON summary generated: \`tests/performance/k6-summary.json\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload K6 Summary
        uses: actions/upload-artifact@v7
        if: always() && matrix.test == 'performance'
        with:
          name: k6-summary
          path: tests/performance/k6-summary.json
