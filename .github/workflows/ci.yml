name: CI / CD (Unified)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  # ==========================================
  #                 BACKEND
  # ==========================================
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docvault/api
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run Lint / Code Style Check
        run: |
          chmod +x mvnw
          ./mvnw validate -B

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: lint-backend
    defaults:
      run:
        working-directory: docvault/api
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Compile Code
        run: |
          chmod +x mvnw
          ./mvnw clean compile -T 1C -B
      - name: Upload Build Target
        uses: actions/upload-artifact@v4
        with:
          name: backend-target
          path: docvault/api/target/
  
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: build-backend
    defaults:
      run:
        working-directory: docvault/api
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRATION_MINUTES: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Download Build Target
        uses: actions/download-artifact@v4
        with:
          name: backend-target
          path: docvault/api/target/
      - name: Run Tests
        run: |
          chmod +x mvnw
          ./mvnw verify -B
      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: "**/site/jacoco"
          if-no-files-found: warn
      - name: Run Mutation Tests (PiTest)
        run: ./mvnw org.pitest:pitest-maven:mutationCoverage -B

  # ==========================================
  #                 FRONTEND
  # ==========================================
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint-frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: build-frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test
      - name: Run E2E Tests (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

  # ==========================================
  #                 DEPLOY
  # ==========================================
  deploy:
    name: Deploy All (Production)
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: 'read'
      id-token: 'write'
    env:
      PROJECT_ID: edtech-api-storage
      REGION: southamerica-east1
      SERVICE_NAME: edtech-backend
      IMAGE: southamerica-east1-docker.pkg.dev/edtech-api-storage/cloud-run-source-deploy/edtech-backend
    steps:
      - uses: actions/checkout@v4
      
      # ==================================
      # DEPLOY FRONTEND (FIREBASE)
      # ==================================
      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Build React App
        run: npm run build
        working-directory: ./frontend
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_EDTECH }}'
          channelId: live
          projectId: edtech-academic
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      # ==================================
      # DEPLOY BACKEND (CLOUD RUN)
      # ==================================
      - id: 'auth'
        name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Container
        run: |-
          cd docvault/api
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} .
          docker push ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        id: deploy-cr
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          env_vars: |
            SPRING_PROFILES_ACTIVE=prod
            STORAGE_PROVIDER=gcs
            GCP_PROJECT_ID=${{ env.PROJECT_ID }}
            GCP_BUCKET_NAME=edtech-storage-prod
          secrets: |
            SPRING_DATASOURCE_URL=SPRING_DATASOURCE_URL:latest
            SPRING_DATASOURCE_USERNAME=SPRING_DATASOURCE_USERNAME:latest
            SPRING_DATASOURCE_PASSWORD=SPRING_DATASOURCE_PASSWORD:latest
            JWT_SECRET=JWT_SECRET:latest

      - name: Show Output
        run: echo ${{ steps.deploy-cr.outputs.url }}
