name: CI Frontend

on:
    pull_request:
        branches:
            - main
            - develop
        paths:
            - 'frontend/**'
            - '.github/workflows/ci-frontend.yml'

permissions:
  contents: read

jobs:
    builds:
        runs-on: ubuntu-latest
        defaults: 
            run: 
                working-directory: frontend
        steps:
            - uses: actions/checkout@v6

            - name: Set up Node 18
              uses: actions/setup-node@v6
              with:
                node-version: '18'
                cache: 'npm'
                cache-dependency-path: 'frontend/package-lock.json'

            - name: Install dependencies
              run: npm ci
             
            - name: Build
              run: npm run build

            - name: Run lint
              run: npm run lint  