name: CI Frontend

on:
    pull_request:
        branches:
            - main
            - develop
        paths:
            - 'docvault/frontend/**'
            - '.github/workflows/ci-frontend.yml'

jobs:
    builds:
        runs-on: ubuntu-latest
        defaults: 
            run: 
                working-directory: docvault/frontend
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node 18
              uses: actions/setup-node@v4
              with:
                node-version: '18'
                cache: 'npm'
                cache-dependency-path: 'docvault/frontend/package-lock.json'

            - name: Install dependencies
              run: npm ci
             
            - name: Build
              run: npm run build

            - name: Run tests
              run: npm test  