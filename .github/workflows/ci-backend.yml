name: CI Backend

on:
    pull_request:
        branches:
            - main
            - develop
        paths:
            - 'docvault/api/**'
            - '.github/workflows/ci-backend.yml'

jobs: 
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: docvault/api
        services: 
            postgres:
                image: postgres:15
                env:
                    POSTGRES_DB: edtech_test
                    POSTGRES_USER: sa
                    POSTGRES_PASSWORD: password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - uses: actions/checkout@v6
            - name: Set up JDK 17
              uses: actions/setup-java@v5
              with:
                java-version: '17'
                distribution: 'temurin'
                cache: maven
           
            - name: Build and Test
              run: mvn verify
              env:
                SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/edtech_test
                SPRING_DATASOURCE_USERNAME: sa
                SPRING_DATASOURCE_PASSWORD: password
   
           
            - name: Upload JaCoCo Report
              uses: actions/upload-artifact@v7
              with:
                name: jacoco-report
                path: docvault/api/target/site/jacoco/
