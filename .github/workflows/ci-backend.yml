name: CI Backend

on:
    pull_request:
        branches:
            - main
            - develop
        paths:
            - 'docvault/api/**'

jobs: 
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: docvault/api
        steps:
            - uses: actions/checkout@v4
            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                java-version: '17'
                distribution: 'temurin'
                cache: maven
            - name: Build and Test
              run: mvn verify
            - name: Upload JaCoCo Report
              uses: actions/upload-artifact@v4
              with:
                name: jacoco-report
                path: docvault/api/target/site/jacoco/
