name: CI Backend

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop
        paths:
            - 'docvault/api/**'
            - '.github/workflows/ci-backend.yml'

permissions:
  contents: read

jobs: 
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: docvault/api
        steps:
            - uses: actions/checkout@v6
            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                java-version: '21'
                distribution: 'temurin'
                cache: maven
           
            - name: Build and Test
              run: mvn verify
              env:
                AWS_ACCESS_KEY_ID: dummy_key
                AWS_SECRET_ACCESS_KEY: dummy_secret
                S3_ENDPOINT: https://abc.supabase.co/storage/v1/s3
                S3_REGION: us-east-1
                S3_BUCKET_NAME: documents
                JWT_SECRET: supersecretjwtsecretkeyformyspringbootapp123
                JWT_EXPIRATION_MINUTES: 60
   
           
            - name: Upload JaCoCo Report
              uses: actions/upload-artifact@v7
              with:
                name: jacoco-report
                path: docvault/api/target/site/jacoco/
