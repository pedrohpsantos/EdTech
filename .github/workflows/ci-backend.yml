name: CI Backend

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'docvault/api/**'
      - '.github/workflows/ci-backend.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: docvault/api

jobs: 
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Run Lint / Code Style Check
        run: mvn validate

  build-backend:
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      

      - name: Compile Code
        run: mvn clean compile

      - name: Upload Build Target
        uses: actions/upload-artifact@v4
        with:
          name: backend-target
          path: docvault/api/target/
  
  test-backend:
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
    
      - name: Download Build Target
        uses: actions/download-artifact@v4
        with:
          name: backend-target
          path: docvault/api/target/

      - name: Run Tests
        run: mvn test
        env: 
          AWS_ACCESS_KEY_ID: dummy_key
          AWS_SECRET_ACCESS_KEY: dummy_secret
          S3_ENDPOINT: https://abc.supabase.co/storage/v1/s3
          S3_REGION: us-east-1
          S3_BUCKET_NAME: documents
          JWT_SECRET: supersecretjwtsecretkeyformyspringbootapp123
          JWT_EXPIRATION_MINUTES: 60
      
      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: docvault/api/target/site/jacoco

  deploy-backend:
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Step Placeholder
        run: echo "Executando o deploy do Backend..."
