steps:
  # ==========================================
  # 1. BUILD BACKEND (DOCKER)
  # ==========================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args: 
      - 'build'
      - '-t'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/edtech-backend:$COMMIT_SHA'
      - '-f'
      - 'backend/Dockerfile.ci'
      - 'backend/'

  # ==========================================
  # 2. PUSH BACKEND (ARTIFACT REGISTRY)
  # ==========================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args: 
      - 'push'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/edtech-backend:$COMMIT_SHA'

  # ==========================================
  # 3. DEPLOY BACKEND (CLOUD RUN)
  # ==========================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'edtech-backend'
      - '--image'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/edtech-backend:$COMMIT_SHA'
      - '--region'
      - 'southamerica-east1'
      - '--allow-unauthenticated'
      - '--memory'
      - '1024Mi'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--cpu-boost'
      - '--add-cloudsql-instances'
      - '$PROJECT_ID:southamerica-east1:edtech-db-dev'
      - '--set-env-vars'
      - 'SPRING_PROFILES_ACTIVE=prod,STORAGE_PROVIDER=gcs,GCP_PROJECT_ID=$PROJECT_ID,GCP_BUCKET_NAME=edtech-vault-storage,SPRING_JPA_HIBERNATE_DDL_AUTO=validate,CORS_ALLOWED_ORIGINS=https://$PROJECT_ID.web.app'
      - '--set-secrets'
      - 'SPRING_DATASOURCE_URL=SPRING_DATASOURCE_URL:latest,SPRING_DATASOURCE_USERNAME=SPRING_DATASOURCE_USERNAME:latest,SPRING_DATASOURCE_PASSWORD=SPRING_DATASOURCE_PASSWORD:latest,JWT_SECRET=JWT_SECRET:latest'

  # ==========================================
  # 4. BUILD FRONTEND (REACT/VITE)
  # ==========================================
  - name: 'node:24'
    id: 'build-frontend'
    entrypoint: 'bash'
    dir: 'frontend'
    args: 
      - '-c'
      - |
        npm ci
        export VITE_API_URL=https://edtech-backend-shv6qbpf4q-rj.a.run.app
        npm run build
        echo $COMMIT_SHA > dist/version.txt

  # ==========================================
  # 5. DEPLOY FRONTEND (FIREBASE HOSTING)
  # ==========================================
  - name: 'node:24'
    id: 'deploy-frontend'
    entrypoint: 'bash'
    dir: 'frontend'
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        # Assumindo que a Cloud Build Service Account tenha a role Firebase Admin,
        # ou utilizando o token repassado pelo env.
        firebase deploy --project=$PROJECT_ID --only hosting -m "Deploy via Cloud Build $COMMIT_SHA" --non-interactive
    secretEnv: ['FIREBASE_TOKEN']

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/${_FIREBASE_SA_SECRET}/versions/latest
    env: 'FIREBASE_TOKEN'

substitutions:
  _FIREBASE_SA_SECRET: 'FIREBASE_SERVICE_ACCOUNT_EDTECH'

options:
  logging: CLOUD_LOGGING_ONLY

