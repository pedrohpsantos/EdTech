services:
  db:
    image: postgres:15-alpine
    container_name: edtech-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edtech_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD deve ser definido em infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-edtech_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edtech-network

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: edtech-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-edtech_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-edtech_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD deve ser definido em infra/.env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET deve ser definido em infra/.env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-gcs}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-local-dev}
      GCP_BUCKET_NAME: ${GCP_BUCKET_NAME:-local-bucket}
      GCP_CREDENTIALS_LOCATION: ${GCP_CREDENTIALS_LOCATION:-}
      STORAGE_EMULATOR_HOST: http://fake-gcs:4443
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP'" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - edtech-network

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:${BACKEND_PORT:-8080}
    container_name: edtech-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    networks:
      - edtech-network

  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    container_name: edtech-fake-gcs
    command: [ "-scheme", "http" ]
    ports:
      - "4443:4443"
    environment:
      PORT: 4443
      STORAGE_EMULATOR_HOST: http://fake-gcs:4443
    networks:
      - edtech-network

  adminer:
    image: adminer
    container_name: edtech-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edtech-network

volumes:
  pgdata:

networks:
  edtech-network:
    driver: bridge
