[project]
name = "edtech"
version = "0.1.0"
description = "Plataforma acadêmica para centralização, gerenciamento e auditoria de publicações científicas — AILAB Makers / UnB FCTE."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["edtech", "mkdocs", "documentação", "acadêmico"]
authors = [
    { name = "Pedro Henrique P. Santos" },
]

dependencies = [
    "mkdocs-material[imaging]>=9.7.6",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocs-glightbox>=0.5.2",
    "mkdocs-git-revision-date-localized-plugin>=1.5.3",
    "mkdocs-print-site-plugin",
    "mkdocs-awesome-pages-plugin>=2.10.1",
    "mkdocs-macros-plugin>=1.5.0",
    "mkdocs-roamlinks-plugin>=0.2.2",
    "mkdocs-git-authors-plugin>=0.10.0"
]

[project.urls]
Documentation = "https://pedrohpsantos.github.io/EdTech/"
Repository = "https://github.com/pedrohpsantos/EdTech"
