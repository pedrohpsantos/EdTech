site_name: EdTech — Repositório Acadêmico
site_description: Documentação oficial do projeto EdTech — Plataforma de centralização, gerenciamento e auditoria de publicações acadêmicas. AILAB Makers — UnB FCTE.
site_url: ""
repo_url: https://github.com/pedrohpsantos/EdTech
repo_name: EdTech

theme:
  name: material
  language: pt-BR
  logo: https://raw.githubusercontent.com/squidfunk/mkdocs-material/master/material/templates/.icons/material/book-open-page-variant.svg
  favicon: https://raw.githubusercontent.com/squidfunk/mkdocs-material/master/material/templates/.icons/material/school.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - navigation.tracking
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Requisitos:
      - Produto e Visão:
          - Product Discovery:
              - Personas: produto/discovery/personas.md
              - Jornadas do Usuário: produto/discovery/jornadas.md
              - Brainstorming (MoSCoW): produto/discovery/brainstorming.md
          - Product Strategy:
              - Visão e Escopo: produto/strategy/visao.md
              - É / Não É / Faz / Não Faz: produto/strategy/matriz_e_nao_e.md
              - Canvas MVP: produto/strategy/canvas_mvp.md
      - Especificação Técnica:
          - Requisitos Funcionais: produto/requisitos/funcionais.md
          - Requisitos Não Funcionais: produto/requisitos/nao-funcionais.md
      - Backlog Ágil:
          - Histórias de Usuário: produto/requisitos/historias.md
  - Arquitetura:
      - C4 Model (Context & Containers): arquitetura/c4_model.md
      - Design Técnico (Detalhado): arquitetura/design_tecnico.md
      - Armazenamento em Nuvem: arquitetura/nuvem.md
      - Arquitetura de Dados: arquitetura/dados.md
      - Segurança e AppSec: arquitetura/seguranca_app.md
      - Decisões Técnicas (ADRs):
          - ADR 0001 (Google Cloud Storage): arquitetura/adrs/0001-armazenamento-gcs.md
  - Planejamento & Gestão:
      - Product Roadmap: gestao/agile/roadmap.md
      - Definition of Ready/Done: gestao/planejamento/dor_dod.md
      - Team Agreements & Ritos: gestao/agile/team_agreements.md
      - Cronograma e Sprints: gestao/planejamento/cronograma.md
      - Papéis e Rotações: gestao/planejamento/rotacoes.md
      - Entregas:
          - Semana 1: gestao/entregas/semana1.md
          - Semana 2: gestao/entregas/semana2.md
          - Semana 3: gestao/entregas/semana3.md
  - Reuniões: 
      - Índice de Atas: gestao/reunioes/atas.md
      - Ata de Reunião (29/05): gestao/reunioes/ata-29-05-2026.md