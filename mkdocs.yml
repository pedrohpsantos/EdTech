site_name: EdTech — Repositório Acadêmico
site_description: Documentação oficial do projeto EdTech — Plataforma de centralização, gerenciamento e auditoria de publicações acadêmicas. AILAB Makers — UnB FCTE.
site_author: AILAB Makers (UnB FCTE)
site_url: https://pedrohpsantos.github.io/EdTech/
repo_url: https://github.com/pedrohpsantos/EdTech
repo_name: pedrohpsantos/EdTech
edit_uri: edit/main/docs/

copyright: "© 2026 AILAB Makers — UnB FCTE"

theme:
  name: material
  language: pt-BR
  logo: assets/svgs/logo-white.svg
  favicon: assets/svgs/favicon.svg
  icon:
    repo: fontawesome/brands/github
    annotation: material/arrow-right-circle
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pedrohpsantos/EdTech
      name: Repositório no GitHub

extra_css:
  - stylesheets/extra.css

not_in_nav: |
  404.md
  _glossary.md
  _snippets/**

plugins:
  - search
  - glightbox
  - social:
      enabled: !ENV [CI, false]
  - git-revision-date-localized
  - minify:
      minify_html: true
      minify_css: true
      minify_js: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.mark
  - pymdownx.critic
  - abbr
  - pymdownx.snippets:
      auto_append:
        - docs/_glossary.md
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Produto e Negócio:
      - Descoberta (Discovery):
          - Personas: produto/discovery/personas.md
          - Jornadas do Usuário: produto/discovery/jornadas.md
          - Brainstorming e MoSCoW: produto/discovery/brainstorming.md
      - Estratégia de Produto:
          - Visão e Escopo: produto/strategy/visao.md
          - É / Não É / Faz / Não Faz: produto/strategy/matriz_e_nao_e.md
          - Canvas MVP: produto/strategy/canvas_mvp.md
      - Requisitos e Backlog:
          - Funcionais: produto/requisitos/funcionais.md
          - Não Funcionais: produto/requisitos/nao-funcionais.md
          - Histórias de Usuário: produto/requisitos/historias.md
      - Planejamento Macro:
          - Roadmap do Produto: produto/planejamento/roadmap.md
          - Cronograma e Sprints: produto/planejamento/cronograma.md
      - Identidade e Design:
          - Identidade Visual: produto/branding/identidade_visual.md
          - Design System: produto/branding/design_system.md
          - Diretrizes da Marca: produto/branding/diretrizes_marca.md
  - Arquitetura de Software:
      - Design Técnico: arquitetura/design_tecnico.md
      - Diagramas de Sistema:
          - C4 Model: arquitetura/diagramas/c4_model.md
          - Arquitetura de Dados: arquitetura/diagramas/dados.md
      - Infraestrutura e Segurança:
          - Armazenamento em Nuvem: arquitetura/infraestrutura/nuvem.md
          - Segurança e AppSec: arquitetura/infraestrutura/seguranca_app.md
      - Decisões Técnicas (ADRs):
          - ADR 0001 (Cloud Storage): arquitetura/adrs/0001-armazenamento-gcs.md
          - ADR 0002 (Autenticação JWT): arquitetura/adrs/0002-autenticacao-jwt.md
          - ADR 0003 (Cloud Run Serverless): arquitetura/adrs/0003-cloud-run.md
          - ADR 0004 (PostgreSQL): arquitetura/adrs/0004-postgresql.md
          - ADR 0005 (Spring Boot): arquitetura/adrs/0005-spring-boot.md
          - ADR 0006 (SPA + API): arquitetura/adrs/0006-spa-api.md
          - ADR 0007 (Flyway Migrations): arquitetura/adrs/0007-flyway.md
          - ADR 0008 (GitHub Actions CI/CD): arquitetura/adrs/0008-github-actions.md
          - ADR 0009 (Docs-as-Code via MkDocs): arquitetura/adrs/0009-mkdocs.md
  - Desenvolvimento (DevEx):
      - Setup e Onboarding: desenvolvimento/guia_local.md
      - Frontend (Vite + React): desenvolvimento/frontend_vite.md
      - Backend (Spring Boot): desenvolvimento/backend_spring.md
      - Pipeline CI/CD: desenvolvimento/ci_cd.md
      - Configuração de CORS: desenvolvimento/cors_configuration.md
      - API Reference: desenvolvimento/api_endpoints.md
      - Contratos de API (Sprint 5): desenvolvimento/api_contracts.md
  - Gestão e Metodologia Ágil:
      - Ritos e Acordos:
          - Acordos do Time: gestao/agile/team_agreements.md
          - DoR & DoD: gestao/agile/dor_dod.md
      - Time e Atribuições:
          - Papéis e Rotações: gestao/equipe/rotacoes.md
          - Trilha de Estudos: gestao/equipe/trilha_estudos.md
      - Histórico de Sprints:
          - Semana 1: gestao/historico_sprints/semana1.md
          - Semana 2: gestao/historico_sprints/semana2.md
          - Semana 3: gestao/historico_sprints/semana3.md
          - Semana 4: gestao/historico_sprints/semana4.md
      - Atas de Reuniões:
          - Índice de Atas: gestao/reunioes/atas.md
          - Ata de Reunião (29/05): gestao/reunioes/ata-29-05-2026.md
          - Ata de Reunião (05/06): gestao/reunioes/ata-05-06-2026.md
          - Ata de Reunião (12/06): gestao/reunioes/ata-12-06-2026.md