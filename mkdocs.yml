site_name: EdTech — Repositório Acadêmico
site_description: Documentação oficial do projeto EdTech — Plataforma de centralização, gerenciamento e auditoria de publicações acadêmicas. AILAB Makers — UnB FCTE.
site_author: AILAB Makers (UnB FCTE)
site_url: https://pedrohpsantos.github.io/EdTech/
repo_url: https://github.com/pedrohpsantos/EdTech
repo_name: pedrohpsantos/EdTech
edit_uri: edit/main/docs/

copyright: "© 2026 AILAB Makers — UnB FCTE"

theme:
  name: material
  language: pt-BR
  logo: assets/svgs/logo-white.svg
  favicon: assets/svgs/favicon.svg
  icon:
    repo: fontawesome/brands/github
    annotation: material/arrow-right-circle
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.prune
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono

extra:
  announce: >
    **🚀 Aviso da Equipe:** Confira nosso mais novo [Roadmap do Produto](produto/planejamento/roadmap.md) e as [Atualizações Críticas de Nuvem](https://github.com/pedrohpsantos/EdTech/issues/102).
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pedrohpsantos/EdTech
      name: Repositório no GitHub

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

not_in_nav: |
  404.md
  _glossary.md
  _snippets/**

plugins:
  - search:
      lang: pt
  - awesome-pages
  - macros
  - roamlinks
  - glightbox
  - social:
      enabled: !ENV [CI, false]
  - git-revision-date-localized
  - tags
  - minify:
      minify_html: true
      minify_css: true
      minify_js: true
  - print-site

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.mark
  - pymdownx.critic
  - abbr
  - pymdownx.snippets:
      auto_append:
        - docs/_glossary.md
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

# Navigation is now automatically generated by mkdocs-awesome-pages-plugin
# using .pages files in each directory.
